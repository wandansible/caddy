---
argument_specs:
  main:
    short_description: Install and configure caddy webserver
    description: |
      Installs the caddy webserver along with any non-standard caddy plugins required.
      Allows for caddy to be configured by adding one or more Caddyfiles.
    options:
      caddy_apt_repo_url:
        description: Base URL for the apt repository
        type: str
        default: "https://dl.cloudsmith.io/public/caddy/stable/deb/debian"

      caddy_apt_repo_suite:
        description: Suite to use for the apt repository
        type: str
        default: "any-version"

      caddy_apt_repo_component:
        description: Component to use for the apt repository
        type: str
        default: "main"

      caddy_apt_repo_gpg_key:
        description: |
          Either a URL to a GPG key, absolute path to a keyring file,
          one or more fingerprints of keys either in the trusted.gpg
          keyring or in the keyrings in the trusted.gpg.d/ directory,
          or an ASCII armored GPG public key block
        type: str
        default: "https://dl.cloudsmith.io/public/caddy/stable/gpg.key"

      caddy_apt_packages:
        description: List of packages to install
        type: list
        elements: str
        default:
          - caddy

      caddy_packages:
        description: List of non-standard caddy packages to install
        type: list
        elements: str
        default: []

      caddy_dpkg_hook_script:
        description: Path to where dpkg hook for caddy should be installed
        type: str
        default: "/usr/local/bin/caddy-upgrade"

      caddy_file:
        description: |
          Contents of the /etc/caddy/Caddyfile configuration file,
          or empty string to leave file as is
        type: str
        default: ""

      caddy_files:
        description: |
          List of additional Caddyfiles to create
        type: list
        elements: dict
        default: []
        options:
          name:
            description: Name of the Caddyfile
            type: str
            required: true
          dir:
            description: Directory for the Caddyfile
            type: str
          config:
            description: Contents of the Caddyfile
            type: str
            required: true
